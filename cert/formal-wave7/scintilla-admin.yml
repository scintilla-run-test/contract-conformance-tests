name: Formal Wave 7
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exhaust process-slot quota bounds
        run: |
          python3 - <<'PY'
          from itertools import product
          quota=4
          for admin, used, requested, duplicate in product((False,True),range(quota+1),range(1,4),(False,True)):
              admitted=admin and used+requested<=quota
              after=used if duplicate or not admitted else used+requested
              assert 0<=after<=quota
              if duplicate or not admitted: assert after==used
          print('Scintilla process-slot quota/idempotency model: ok')
          PY
