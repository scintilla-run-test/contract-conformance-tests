name: TypeSpec and JSON Schema peer-authority parity

on:
  pull_request:
    paths:
      - "test/fixtures/schema-authority-canary/**"
      - "contract-admission/scintilla-wasi-component.v1.json"
      - "test/wasi-component-contract-admission.test.mjs"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  push:
    branches: [main, dev]
    paths:
      - "test/fixtures/schema-authority-canary/**"
      - "contract-admission/scintilla-wasi-component.v1.json"
      - "test/wasi-component-contract-admission.test.mjs"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-peer-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Generate Schema B and compare local canary peer authorities
        uses: ORESoftware/typespec-json-schema-validator@813d5f021e02574f529a9553b670719f8f10d02c
        with:
          typespec: test/fixtures/schema-authority-canary/main.tsp
          schema: test/fixtures/schema-authority-canary/authored.schema.json
          report: .typespec-json-schema-validator/canary/report.json
          sarif: .typespec-json-schema-validator/canary/report.sarif
          contract_ir: .typespec-json-schema-validator/canary/contract-ir.json
          output_dir: .typespec-json-schema-validator/canary/generated
          max_probes: "64"

      - name: Verify complete local canary declaration scope
        uses: ORESoftware/typespec-json-schema-validator/actions/verify-contract-ir@813d5f021e02574f529a9553b670719f8f10d02c
        with:
          contract_ir: .typespec-json-schema-validator/canary/contract-ir.json
          report: .typespec-json-schema-validator/canary/report.json
          typespec: test/fixtures/schema-authority-canary/main.tsp
          schema: test/fixtures/schema-authority-canary/authored.schema.json
          generated_schema: .typespec-json-schema-validator/canary/generated/typespec.generated.schema.json
          expected_declarations: '["OreSchemaAuthority.AuthorityKind","OreSchemaAuthority.PeerAuthorityRegistration"]'
          verification: .typespec-json-schema-validator/canary/consumer-verification.json

      - name: Verify pinned Scintilla WASI external admission evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const manifest = JSON.parse(
            await readFile('contract-admission/scintilla-wasi-component.v1.json', 'utf8'),
          );

          assert.equal(manifest.contract.id, 'scintilla.wasi-component/v1');
          assert.equal(
            manifest.validator.commit,
            '813d5f021e02574f529a9553b670719f8f10d02c',
          );
          assert.equal(manifest.admitted_evidence.status, 'passed');
          assert.equal(manifest.admitted_evidence.zero_unexplained_findings, true);
          assert.equal(manifest.consumer_policy.allow_local_reauthoring, false);
          assert.equal(
            manifest.consumer_policy.allow_generated_projection_as_authority,
            false,
          );

          const proofRepository = manifest.admitted_evidence.proof_repository;
          const runId = manifest.admitted_evidence.workflow_run_id;
          const runResponse = await fetch(
            `https://api.github.com/repos/${proofRepository}/actions/runs/${runId}`,
            { headers: { Accept: 'application/vnd.github+json' } },
          );
          assert.equal(runResponse.ok, true);
          const run = await runResponse.json();
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'success');
          assert.equal(run.head_sha, manifest.admitted_evidence.proof_head_commit);

          const artifactsResponse = await fetch(
            `https://api.github.com/repos/${proofRepository}/actions/runs/${runId}/artifacts`,
            { headers: { Accept: 'application/vnd.github+json' } },
          );
          assert.equal(artifactsResponse.ok, true);
          const artifacts = await artifactsResponse.json();
          const matching = artifacts.artifacts.find(
            (artifact) => artifact.digest === manifest.admitted_evidence.artifact_digest,
          );
          assert.ok(matching);
          assert.equal(matching.expired, false);
          NODE

      - name: Run source-bound WASI admission tests
        run: node --test test/wasi-component-contract-admission.test.mjs

      - name: Verify authored local canary authorities were not modified
        shell: bash
        run: git diff --exit-code -- test/fixtures/schema-authority-canary/

      - name: Retain local canary diagnostic receipt and IR
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-peer-authority-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
