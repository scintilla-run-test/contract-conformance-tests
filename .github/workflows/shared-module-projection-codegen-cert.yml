name: shared module projection codegen exact-head cert

on:
  pull_request:
    paths:
      - ".github/workflows/shared-module-projection-codegen-cert.yml"
      - "cert/shared-module-projections/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Verify exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cert/shared-module-projections/beamscale-manifest.json)" = "88e7ca5f9eeaa700fdaa7e0c073d76e55df4defe"
          test "$(git hash-object cert/shared-module-projections/scintilla-manifest.json)" = "fbdc85f9d7223e5ef51554f8e680cc7749126dd6"
          test "$(git hash-object cert/shared-module-projections/scintilla-manifest.schema.json)" = "ebf23ec3e48eaa42349b30f8c3ecad66d777a970"
          test "$(git hash-object cert/shared-module-projections/api-docs-module-interface-codegen.rs)" = "2a2ed8e0289bb6998e5290b2e756805fefc79000"
      - name: Prove shared generator pins and runtime boundaries
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');

          const beam = JSON.parse(fs.readFileSync('cert/shared-module-projections/beamscale-manifest.json', 'utf8'));
          const scintilla = JSON.parse(fs.readFileSync('cert/shared-module-projections/scintilla-manifest.json', 'utf8'));
          const schema = JSON.parse(fs.readFileSync('cert/shared-module-projections/scintilla-manifest.schema.json', 'utf8'));
          const generatorSource = fs.readFileSync('cert/shared-module-projections/api-docs-module-interface-codegen.rs', 'utf8');

          const commit = 'c02712957850046e339b1e94d8d41b219feb304c';
          for (const [name, manifest, profile] of [
            ['beamscale', beam, 'beam_scale'],
            ['scintilla', scintilla, 'scintilla'],
          ]) {
            assert.equal(manifest.generator.repository, 'ORESoftware/api-docs', name);
            assert.equal(manifest.generator.rust_api, 'render_module_interface', name);
            assert.equal(manifest.generator.runtime_profile, profile, name);
            assert.equal(manifest.generator.generated_files_read_only, true, name);
            assert.equal(manifest.generator.commit, commit, name);
            assert.match(manifest.generator.commit, /^[0-9a-f]{40}$/);
          }

          assert.equal(beam.runtime_family, 'beam');
          assert.deepEqual(beam.rules.direct_guest_languages, ['erlang', 'gleam']);
          assert.equal(beam.rules.non_beam_projection_does_not_imply_guest_support, true);
          assert.equal(beam.rules.capabilities_are_runtime_grants_not_imports, true);
          assert.deepEqual(
            beam.languages.filter((x) => x.role === 'direct_guest').map((x) => x.id).sort(),
            ['erlang', 'gleam'],
          );
          for (const entry of beam.languages) {
            if (!['erlang', 'gleam'].includes(entry.id)) assert.notEqual(entry.role, 'direct_guest');
            assert.equal('capabilities' in entry, false);
            assert.equal('imports' in entry, false);
          }

          assert.equal(scintilla.version, 'scintilla.module-projections/v1');
          assert.equal(scintilla.rules.prefer_native_module_contract, true);
          assert.equal(scintilla.rules.fallback_export_value_must_be_typed, true);
          assert.equal(scintilla.rules.projection_must_preserve_invocation_semantics, true);
          assert.equal(scintilla.rules.projection_does_not_define_transport_schema, true);
          assert.deepEqual(
            scintilla.languages.map((x) => x.id),
            ['rust','typescript','dart','gleam','erlang','sml','ocaml','racket','ada','modula2','modula3','haskell','wit'],
          );

          assert.deepEqual(schema.required, ['version', 'generator', 'rules', 'languages']);
          assert.equal(schema.$defs.generator.additionalProperties, false);
          assert.equal(schema.$defs.generator.properties.repository.const, 'ORESoftware/api-docs');
          assert.equal(schema.$defs.generator.properties.rust_api.const, 'render_module_interface');
          assert.equal(schema.$defs.generator.properties.runtime_profile.const, 'scintilla');
          assert.equal(schema.$defs.generator.properties.generated_files_read_only.const, true);
          assert.equal(schema.$defs.generator.properties.commit.const, commit);

          assert.match(generatorSource, /pub fn render_module_interface\s*\(/);
          assert.match(generatorSource, /RuntimeLanguageMismatch/);
          assert.match(generatorSource, /allows_projection_language/);
          NODE
