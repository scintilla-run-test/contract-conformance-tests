name: Scintilla release-contract exact-head proof

on:
  pull_request:
    paths:
      - ".github/workflows/scintilla-release-contract-proof.yml"
      - "vendor/scintilla-interfaces/**"
      - "scripts/verify_scintilla_release_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scintilla-release-contract-proof.yml"
      - "vendor/scintilla-interfaces/**"
      - "scripts/verify_scintilla_release_contract.py"

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Verify vendored Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object vendor/scintilla-interfaces/schemas/release-definition.schema.json)" = "b13a2385922d441e3c408c04a60c56a6d96d16a6"
          test "$(git hash-object vendor/scintilla-interfaces/fixtures/release-valid-flexible-middleware.json)" = "76a1243023b26a547c121fd7859c68ab92b03a8b"
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Execute release-contract proof
        run: python scripts/verify_scintilla_release_contract.py
