name: Scintilla release-contract exact-head proof

on:
  pull_request:
    paths:
      - ".github/workflows/scintilla-release-contract-proof.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scintilla-release-contract-proof.yml"

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: scintilla-run/scintilla-interfaces
      SOURCE_SHA: 8d6840d071214aca8e71604153bc4c1124693564
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require protected source credential
        env:
          TOKEN: ${{ secrets.TEST_FLEET_READ_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TEST_FLEET_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install schema test dependencies
        working-directory: source
        run: npm ci
      - name: Validate release schema and fixtures
        working-directory: source
        run: node --test tests/release-definition.test.mjs
      - name: Prove API and route digests remain distinct
        working-directory: source
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const schema = JSON.parse(fs.readFileSync('schemas/release-definition.schema.json'));
          const fixture = JSON.parse(fs.readFileSync('fixtures/release-valid-flexible-middleware.json'));
          if (!schema.required.includes('apiContractSha256')) throw new Error('apiContractSha256 is not required');
          if (fixture.apiContractSha256 === fixture.routeTableSha256) throw new Error('API and route digests were conflated');
          NODE
