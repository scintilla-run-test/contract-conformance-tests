name: k8s web-api Zed target canary

on:
  pull_request:
    paths:
      - "proofs/k8s-web-api-data-plane-zed/**"
      - ".github/workflows/k8s-web-api-data-plane-zed-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-web-api-zed-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact canary head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head and source lock
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          lock=proofs/k8s-web-api-data-plane-zed/SOURCE.lock
          grep -qx 'source_repo=ORESoftware/k8s-libs-and-shared-defs' "$lock"
          grep -qx 'source_pr=128' "$lock"
          grep -qx 'source_head_sha=d91e038d7f428b22648f9a4ef2e0bbf87eec6517' "$lock"

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install pinned Zed validator
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked             --git https://github.com/zed-pkg/zed-cli.git             --rev dbd63f1d87d12c2e8cb9a8c600fae9b79f94e559             --root "$RUNNER_TEMP/zed"             --bin zed             zed-cli
          printf '%s
' "$RUNNER_TEMP/zed/bin" >> "$GITHUB_PATH"

      - name: Validate target manifest shape
        shell: bash
        run: |
          set -euo pipefail
          zed validate             --manifest proofs/k8s-web-api-data-plane-zed/provider.zpkg.toml             --json

      - name: Compile consumer through vendored Zed path
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.88.0 run             --manifest-path proofs/k8s-web-api-data-plane-zed/consumer/Cargo.toml

      - name: Require tracked state unchanged
        run: git diff --exit-code -- proofs/k8s-web-api-data-plane-zed
