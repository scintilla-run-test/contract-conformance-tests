name: Forms clients PR 9 proof

on:
  push:
    branches:
      - proof/forms-clients-pr9-c75075a

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify source pin
        run: grep -F 'c75075a7eb2086a17ef717310a24f72b288f5b99' proofs/forms-clients-pr9-rust/src/lib.rs
      - name: Format
        working-directory: proofs/forms-clients-pr9-rust
        run: cargo fmt --all -- --check
      - name: Test
        working-directory: proofs/forms-clients-pr9-rust
        run: cargo test
      - name: Clippy
        working-directory: proofs/forms-clients-pr9-rust
        run: cargo clippy --all-targets -- -D warnings

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source pin and no generic raw request helper
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'c75075a7eb2086a17ef717310a24f72b288f5b99' proofs/forms-clients-pr9-ts/wire.ts
          ! grep -F 'rawBinaryRequest' proofs/forms-clients-pr9-ts/wire.ts
      - name: Install
        working-directory: proofs/forms-clients-pr9-ts
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: proofs/forms-clients-pr9-ts
        run: npm run check
      - name: Test
        working-directory: proofs/forms-clients-pr9-ts
        run: npm test

  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Verify source pin and no generic raw request helper
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'c75075a7eb2086a17ef717310a24f72b288f5b99' proofs/forms-clients-pr9-dart/lib/wire.dart
          ! grep -F 'rawBinaryRequest' proofs/forms-clients-pr9-dart/lib/wire.dart
      - name: Analyze
        working-directory: proofs/forms-clients-pr9-dart
        run: dart analyze
      - name: Test
        working-directory: proofs/forms-clients-pr9-dart
        run: dart --enable-asserts run bin/proof.dart
