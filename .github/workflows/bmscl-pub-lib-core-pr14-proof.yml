name: BeamScale pub-lib-core candidate proof

on:
  pull_request:
    paths:
      - "proofs/bmscl-pub-lib-core-pr14/**"
      - ".github/workflows/bmscl-pub-lib-core-pr14-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.1.1"
          gleam-version: "1.18.1"
          version-type: strict
      - name: Show canonical Gleam formatting
        working-directory: proofs/bmscl-pub-lib-core-pr14
        run: |
          set -euo pipefail
          gleam format src
          git diff -- src/bmscl.gleam
          git diff --exit-code -- src/bmscl.gleam
      - name: Test candidate source
        working-directory: proofs/bmscl-pub-lib-core-pr14
        run: |
          gleam check --target erlang
          gleam build --target erlang
