name: Scintilla context ABI field parity exact-head cert

on:
  pull_request:
    paths:
      - ".github/workflows/context-abi-field-parity-cert.yml"
      - "cert/context-abi/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact candidate blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cert/context-abi/scintilla-lib-core/module_contract.rs)" = "67357e1f3819dfec50085be33b677111bd75e652"
          test "$(git hash-object cert/context-abi/runner/child-runtimes/lambda-context.mjs)" = "7cf5993ead39d72f7229ad861c3ea18404f6be4d"
          test "$(git hash-object cert/context-abi/runner/test/lambda-context.test.mjs)" = "cd8230747c006d09e556b82b7af3d75c135aa8d1"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Prove canonical Rust context contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cert/context-abi/scintilla-lib-core/src
          cp cert/context-abi/scintilla-lib-core/module_contract.rs cert/context-abi/scintilla-lib-core/src/lib.rs
          cargo fmt --manifest-path cert/context-abi/scintilla-lib-core/Cargo.toml -- --check
          cargo clippy --manifest-path cert/context-abi/scintilla-lib-core/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path cert/context-abi/scintilla-lib-core/Cargo.toml --all-targets
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Prove runner delivers public context ABI
        working-directory: cert/context-abi/runner
        run: |
          node --check child-runtimes/lambda-context.mjs
          node --test test/lambda-context.test.mjs
      - name: Cross-check field semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'pub abi: String' cert/context-abi/scintilla-lib-core/module_contract.rs
          grep -Fq 'pub invocation_id: String' cert/context-abi/scintilla-lib-core/module_contract.rs
          grep -Fq 'pub timeout_ms: u32' cert/context-abi/scintilla-lib-core/module_contract.rs
          grep -Fq 'pub traceparent: Option<String>' cert/context-abi/scintilla-lib-core/module_contract.rs
          grep -Fq 'abi: SCINTILLA_CONTEXT_ABI' cert/context-abi/runner/child-runtimes/lambda-context.mjs
          grep -Fq 'invocationId' cert/context-abi/runner/child-runtimes/lambda-context.mjs
          grep -Fq 'timeoutMs' cert/context-abi/runner/child-runtimes/lambda-context.mjs
          grep -Fq 'traceparent' cert/context-abi/runner/child-runtimes/lambda-context.mjs
