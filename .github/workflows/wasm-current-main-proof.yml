name: wasm-xprs exact merged main proof

on:
  push:
    branches:
      - probe/wasm-current-main-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact daemon main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wasm-xprs/wasmx-desktop-daemon
          ref: 9906d0bdfc4fe1760fca75569670f91e793e1c85
          path: daemon
          persist-credentials: false
      - name: Checkout exact CLI main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wasm-xprs/wasmx-desktop-cli
          ref: 265c4768f22ea78d020f8eebcdba4795654d652f
          path: cli
          persist-credentials: false
      - name: Checkout exact infra main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wasm-xprs/wasmx-desktop-infra
          ref: 467624058ba70ab8bcfc3e0f9f4340d27ba2494f
          path: infra
          persist-credentials: false
      - name: Prove exact checked revisions and contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C daemon rev-parse HEAD)" = 9906d0bdfc4fe1760fca75569670f91e793e1c85
          test "$(git -C cli rev-parse HEAD)" = 265c4768f22ea78d020f8eebcdba4795654d652f
          test "$(git -C infra rev-parse HEAD)" = 467624058ba70ab8bcfc3e0f9f4340d27ba2494f
          grep -q '127.0.0.1:8766' cli/.cli-flags.toml
          grep -q '127.0.0.1:8766' infra/.ores-compose.yaml
          grep -q '127.0.0.1:8766' infra/appliance.json
          grep -q 'ores_adapter_raw_base64' cli/src/main.rs
          grep -q 'ores_receipt_raw_base64' cli/src/main.rs
          grep -q 'validate_receipt_ack' cli/src/main.rs
          grep -q 'ores_adapter_raw_base64' daemon/src/main.rs
          grep -q 'ores_receipt_raw_base64' daemon/src/main.rs
          grep -q 'const DEFAULT_ADDR: &str = "127.0.0.1:8766"' daemon/src/main.rs
          grep -q 'wasi_enabled: false' daemon/src/main.rs
      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - name: Test exact merged main heads
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path daemon/Cargo.toml --all -- --check
          cargo test --manifest-path daemon/Cargo.toml --all-targets
          cargo clippy --manifest-path daemon/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path cli/Cargo.toml --all -- --check
          cargo test --manifest-path cli/Cargo.toml --all-targets
          cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
