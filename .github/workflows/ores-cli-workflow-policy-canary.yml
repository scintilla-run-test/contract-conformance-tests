name: ORES CLI workflow-policy canary

on:
  pull_request:
    paths:
      - "proofs/ores-cli-workflow-policy/**"
      - ".github/workflows/ores-cli-workflow-policy-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-workflow-policy-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout verifier exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Verify source evidence lock
        shell: bash
        run: |
          set -euo pipefail
          lock=proofs/ores-cli-workflow-policy/SOURCE.lock
          grep -qx 'source_repo=ORESoftware/ores-cli' "$lock"
          grep -qx 'source_pr=421' "$lock"
          grep -qx 'source_head_sha=f788fbb4356c914f559d3f0bd7e4260ead3443a9' "$lock"
          grep -qx 'source_merge_sha=99f219a58ed7ab25e679ca3736d00f9c44072153' "$lock"

      - name: Install declared Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy

      - name: Format oracle
        run: cargo +1.88.0 fmt --manifest-path proofs/ores-cli-workflow-policy/Cargo.toml -- --check

      - name: Clippy oracle
        run: cargo +1.88.0 clippy --manifest-path proofs/ores-cli-workflow-policy/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run independent conformance oracle
        run: cargo +1.88.0 test --manifest-path proofs/ores-cli-workflow-policy/Cargo.toml --locked --all-targets

      - name: Require deterministic tracked state
        shell: bash
        run: git diff --exit-code -- proofs/ores-cli-workflow-policy
